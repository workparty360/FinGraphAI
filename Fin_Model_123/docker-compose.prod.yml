# ==============================================================================
# FinGraph AI — Production Docker Compose Configuration (AWS EC2)
# Fully hardened with Caddy automatic TLS reverse proxy, private networking,
# persistent database volumes, and container health checks.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy (Public Entrypoint: 80 / 443)
  # Automatic TLS via Let's Encrypt / ZeroSSL, WebSocket support, HTTP->HTTPS
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: fingraph-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fingraph_network

  # ----------------------------------------------------------------------------
  # FalkorDB Graph Database Engine (Private - No Public Host Ports)
  # Stores connected financial knowledge, sector relationships & provenance
  # ----------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: fingraph-falkordb
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      FALKORDB_ARGS: "THREAD_COUNT 8"
    volumes:
      - falkor_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fingraph_network

  # ----------------------------------------------------------------------------
  # FinGraph AI Application (Private - Streamlit UI + Agent Team + Graph Engine)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fingraph-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=financial_knowledge
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - fingraph_network

  # ----------------------------------------------------------------------------
  # One-Time Graph Seeder (Run with: docker compose --profile init up seeder)
  # ----------------------------------------------------------------------------
  seeder:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fingraph-seeder
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=financial_knowledge
    depends_on:
      falkordb:
        condition: service_healthy
    command: >
      sh -c "python scripts/init_graph.py &&
             python scripts/seed_graph.py &&
             python scripts/verify_graph.py"
    restart: "no"
    networks:
      - fingraph_network

networks:
  fingraph_network:
    driver: bridge

volumes:
  falkor_data:
    name: fingraph_falkor_data
  caddy_data:
    name: fingraph_caddy_data
  caddy_config:
    name: fingraph_caddy_config
